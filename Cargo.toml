[package]
name = "geo-conjecturer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
dotenv = "0.15.0"
maud = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.22.0", features = ["v4"] }
